name: epsel_smart_reader
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.12.0
  cloud_firestore: ^4.17.0
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  firebase_storage: ^11.7.0
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # --- PAQUETES PARA EXPORTACIÓN A PDF ---
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_epsel.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/usuarios.json
    - assets/images/logo_epsel.jpeg
    - assets/images/fondo_agua.jpeg
